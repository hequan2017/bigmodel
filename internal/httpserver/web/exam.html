<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 能力考试 · 学生端</title>
<style>
  body { font-family: system-ui, "PingFang SC", sans-serif; background: #f4f6f9; margin: 0; }
  header { background: #1f2937; color: #fff; padding: 12px 24px; display: flex;
           justify-content: space-between; align-items: center; }
  header .name { font-size: 15px; }
  header button { background: #374151; color: #fff; border: 0; border-radius: 6px;
                  padding: 6px 12px; cursor: pointer; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
          padding: 20px 24px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e5e7eb; }
  button.act { background: #2563eb; color: #fff; border: 0; border-radius: 6px;
               padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.act:disabled { background: #9ca3af; cursor: not-allowed; }
  button.act.green { background: #059669; }
  .q { border-top: 1px dashed #e5e7eb; padding: 14px 0; }
  .q .stem { font-weight: 600; color: #111827; }
  .q label { display: block; margin: 6px 0; cursor: pointer; font-size: 14px; color: #374151; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px;
           background: #e5e7eb; color: #374151; margin-left: 8px; }
  .badge.done { background: #d1fae5; color: #065f46; }
  #countdown { font-size: 22px; font-weight: 700; color: #b91c1c; }
  #saveStatus { font-size: 13px; color: #6b7280; }
  #saveStatus.err { color: #dc2626; }
  .hidden { display: none; }
  .meta { color: #6b7280; font-size: 13px; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .nav a { text-decoration: none; font-size: 13px; padding: 4px 8px; border-radius: 6px;
           background: #eef2ff; color: #3730a3; }
  .nav a.unanswered { background: #fef3c7; color: #92400e; }
  .err { color: #dc2626; font-size: 14px; }
  .big { font-size: 30px; font-weight: 700; color: #111827; }
</style>
</head>
<body>
<header>
  <div class="name">AI 能力考试 · 学生端（<span id="whoami"></span>）</div>
  <div><a href="/chat.html" style="color:#93c5fd;text-decoration:none;margin-right:12px">教学问答</a>
  <button onclick="logout()">退出登录</button></div>
</header>
<main>
  <div id="view-list" class="card">
    <h2>可参加考试</h2>
    <table id="examTable"><thead>
      <tr><th>考试</th><th>等级</th><th>开放时间</th><th>截止时间</th><th>状态</th><th></th></tr>
    </thead><tbody></tbody></table>
    <div id="listErr" class="err"></div>
  </div>

  <div id="view-taking" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong id="examTitle"></strong> <span class="meta" id="examLevel"></span></div>
        <div>剩余时间 <span id="countdown">--:--</span></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <div class="nav" id="qnav"></div>
        <div id="saveStatus">尚未保存</div>
      </div>
    </div>
    <div class="card" id="questions"></div>
    <div class="card">
      <button class="act green" id="submitBtn" onclick="submitExam()">交卷</button>
      <span class="meta">交卷前会自动保存全部答案；提交后不可修改。</span>
      <div id="submitErr" class="err"></div>
    </div>
  </div>

  <div id="view-result" class="card hidden">
    <h2>考试结果</h2>
    <div id="resultBody"></div>
    <button class="act" onclick="loadList()">返回考试列表</button>
  </div>
</main>
<script>
const TOKEN = sessionStorage.getItem("token");
const ROLE = sessionStorage.getItem("role");
document.getElementById("whoami").textContent = sessionStorage.getItem("name") || "";
if (!TOKEN || ROLE !== "student") location.href = "/";

function logout() { sessionStorage.clear(); location.href = "/"; }
function headers() { return { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }; }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw { code: "unauthorized" }; }
  if (!r.ok) throw { status: r.status, code: d.error ? d.error.code : "error", message: d.error ? d.error.message : "请求失败" };
  return d;
}

function show(view) {
  for (const v of ["view-list", "view-taking", "view-result"]) {
    document.getElementById(v).classList.toggle("hidden", v !== view);
  }
}

/* ---------- 考试列表 ---------- */
function fmtTime(s) { return new Date(s).toLocaleString("zh-CN", { hour12: false }); }
function windowText(w) { return w === "open" ? "开放中" : (w === "not_open" ? "未开始" : "已截止"); }

async function loadList() {
  stopTimer();
  show("view-list");
  try {
    const d = await api("GET", "/api/exam/available");
    const tbody = document.querySelector("#examTable tbody");
    tbody.innerHTML = "";
    for (const e of d.exams) {
      const tr = document.createElement("tr");
      let action = "";
      if (e.attempt_status === "submitted") {
        action = `<button class="act" onclick="viewResult(${e.id})">查看成绩</button>`;
      } else if (e.attempt_status === "in_progress") {
        action = `<button class="act green" onclick="resumeExam(${e.id})">继续作答</button>`;
      } else if (e.window === "open") {
        action = `<button class="act" onclick="startExam(${e.id})">开始考试</button>`;
      } else {
        action = `<button class="act" disabled>${windowText(e.window)}</button>`;
      }
      const st = e.attempt_status === "submitted"
        ? `<span class="badge done">已交卷 ${e.total_score != null ? "· " + e.total_score + " 分" : ""}</span>`
        : (e.attempt_status === "in_progress" ? `<span class="badge">作答中</span>`
           : `<span class="badge">${windowText(e.window)}</span>`);
      tr.innerHTML = `<td>${e.title}</td><td>${e.level_code || "-"}</td>
        <td>${fmtTime(e.open_at)}</td><td>${fmtTime(e.close_at)}</td><td>${st}</td><td>${action}</td>`;
      tbody.appendChild(tr);
    }
  } catch (e) {
    document.getElementById("listErr").textContent = e.message || "加载失败";
  }
}

/* ---------- 开始 / 恢复 ---------- */
let state = { examId: 0, rev: 0, deadline: 0, clockOffset: 0, items: [], answers: {},
              timer: null, saveTimer: null, saving: false, dirty: false, finished: false };

async function startExam(id) { await enterExam(id, "POST"); }
async function resumeExam(id) { await enterExam(id, "GET"); }

async function enterExam(id, method) {
  try {
    const d = await api(method, "/api/exam/exams/" + id + "/attempts");
    const a = d.attempt;
    if (a.status === "submitted") { await viewResult(id); return; }
    state = { examId: id, rev: a.answer_revision, deadline: new Date(a.deadline_at).getTime(),
              clockOffset: new Date(a.server_now).getTime() - Date.now(),
              items: a.items, answers: { ...a.saved_answers },
              timer: null, saveTimer: null, saving: false, dirty: false, finished: false };
    document.getElementById("examTitle").textContent = a.title;
    document.getElementById("examLevel").textContent = a.level_code ? "等级: " + a.level_code : "";
    renderQuestions();
    show("view-taking");
    setStatus("等待作答");
    startTimer();
  } catch (e) {
    alert(e.message || "进入考试失败");
    loadList();
  }
}

function renderQuestions() {
  const box = document.getElementById("questions");
  box.innerHTML = "";
  for (const it of state.items) {
    const div = document.createElement("div");
    div.className = "q";
    div.id = "q" + it.item_id;
    let body = "";
    if (it.type === "single") {
      for (const o of (it.options || [])) {
        body += `<label><input type="radio" name="q${it.item_id}" value="${o.key}"
          ${state.answers[it.item_id] === o.key ? "checked" : ""}> ${o.key}. ${o.text}</label>`;
      }
    } else {
      body += `<label><input type="radio" name="q${it.item_id}" value="true"
        ${state.answers[it.item_id] === "true" ? "checked" : ""}> 正确</label>
        <label><input type="radio" name="q${it.item_id}" value="false"
        ${state.answers[it.item_id] === "false" ? "checked" : ""}> 错误</label>`;
    }
    const answered = state.answers[it.item_id] ? "已答" : "未答";
    div.innerHTML = `<div class="stem">${it.order_no}. ${it.stem}
      <span class="badge" id="badge${it.item_id}">${answered}</span>
      <span class="meta">（${it.type === "single" ? "单选题" : "判断题"} · ${it.score} 分）</span></div>${body}`;
    box.appendChild(div);
  }
  box.onchange = (e) => {
    const m = e.target.name.match(/^q(\d+)$/);
    if (!m) return;
    state.answers[m[1]] = e.target.value;
    updateBadges();
    state.dirty = true;
    scheduleSave();
  };
  renderNav();
}

function updateBadges() {
  for (const it of state.items) {
    const b = document.getElementById("badge" + it.item_id);
    if (!b) continue;
    const answered = !!state.answers[it.item_id];
    b.textContent = answered ? "已答" : "未答";
    b.className = "badge" + (answered ? " done" : "");
  }
  renderNav();
}

function renderNav() {
  const nav = document.getElementById("qnav");
  nav.innerHTML = "";
  for (const it of state.items) {
    const a = document.createElement("a");
    a.href = "#q" + it.item_id;
    a.textContent = "第" + it.order_no + "题";
    if (!state.answers[it.item_id]) a.className = "unanswered";
    nav.appendChild(a);
  }
}

/* ---------- 倒计时 ---------- */
function remainingMs() { return state.deadline - (Date.now() + state.clockOffset); }

function startTimer() {
  stopTimer();
  state.timer = setInterval(() => {
    const left = remainingMs();
    if (left <= 0) {
      document.getElementById("countdown").textContent = "00:00";
      stopTimer();
      autoSubmitOnExpire();
      return;
    }
    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    document.getElementById("countdown").textContent =
      String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }, 500);
}
function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

/* ---------- 自动保存（§15.2：800ms 防抖，失败 10 秒重试） ---------- */
function setStatus(text, isErr) {
  const el = document.getElementById("saveStatus");
  el.textContent = text;
  el.className = isErr ? "err" : "";
  el.id = "saveStatus";
}

function scheduleSave() {
  if (state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(doSave, 800);
}

async function doSave() {
  if (state.saving || state.finished || remainingMs() <= 0) return;
  state.saving = true;
  setStatus("保存中...");
  const answers = state.items
    .map((it) => ({ item_id: it.item_id, answer: state.answers[it.item_id] || "" }))
    .filter((x) => x.answer !== "");
  try {
    const d = await api("PUT", `/api/exam/exams/${state.examId}/attempts/answers`,
      { expected_revision: state.rev, answers });
    state.rev = d.answer_revision;
    state.dirty = false;
    setStatus("已保存 " + new Date().toLocaleTimeString("zh-CN", { hour12: false }));
  } catch (e) {
    if (e.code === "revision_conflict") {
      // 保留当前页面答案，同步服务器版本后重试（不静默覆盖）。
      try {
        const d = await api("GET", `/api/exam/exams/${state.examId}/attempts`);
        state.rev = d.attempt.answer_revision;
        setStatus("检测到版本冲突，已同步服务器版本，正在重试保存...");
        setTimeout(doSave, 300);
      } catch (e2) { setStatus("版本冲突且同步失败，将在 10 秒后重试", true); setTimeout(doSave, 10000); }
    } else if (e.code === "attempt_expired") {
      stopTimer();
      setStatus("已超过截止时间，停止保存", true);
      await viewResult(state.examId);
    } else if (e.code === "attempt_submitted") {
      stopTimer();
      await viewResult(state.examId);
    } else {
      setStatus("保存失败，10 秒后重试（" + (e.message || "网络错误") + "）", true);
      setTimeout(doSave, 10000);
    }
  } finally {
    state.saving = false;
  }
}
setInterval(() => { if (state.dirty && !state.saving && remainingMs() > 0) doSave(); }, 10000);

/* ---------- 交卷与结果 ---------- */
function unansweredCount() {
  return state.items.filter((it) => !state.answers[it.item_id]).length;
}

async function submitExam() {
  const n = unansweredCount();
  const msg = n > 0 ? `还有 ${n} 题未作答，确定交卷吗？` : "确定交卷吗？";
  if (!confirm(msg)) return;
  document.getElementById("submitErr").textContent = "";
  try { await doSaveNow(); } catch (e) {
    document.getElementById("submitErr").textContent = "最终保存失败：" + (e.message || "请稍后重试");
    return;
  }
  try {
    await api("POST", `/api/exam/exams/${state.examId}/attempts/submit`,
      { expected_revision: state.rev });
    state.finished = true;
    stopTimer();
    await viewResult(state.examId);
  } catch (e) {
    if (e.code === "revision_conflict") {
      document.getElementById("submitErr").textContent = "版本冲突，请稍候自动同步后重试交卷。";
      setTimeout(submitExam, 1500);
    } else if (e.code === "attempt_expired") {
      await viewResult(state.examId);
    } else {
      document.getElementById("submitErr").textContent = e.message || "交卷失败，请重试";
    }
  }
}

async function autoSubmitOnExpire() {
  setStatus("已到截止时间，正在自动交卷...", true);
  try {
    await api("POST", `/api/exam/exams/${state.examId}/attempts/submit`,
      { expected_revision: state.rev });
  } catch (e) { /* 已到期或已提交：以服务器结算为准 */ }
  state.finished = true;
  await viewResult(state.examId);
}

async function doSaveNow() {
  if (state.saveTimer) { clearTimeout(state.saveTimer); state.saveTimer = null; }
  const answers = state.items
    .map((it) => ({ item_id: it.item_id, answer: state.answers[it.item_id] || "" }))
    .filter((x) => x.answer !== "");
  const d = await api("PUT", `/api/exam/exams/${state.examId}/attempts/answers`,
    { expected_revision: state.rev, answers });
  state.rev = d.answer_revision;
  state.dirty = false;
}

async function viewResult(examId) {
  stopTimer();
  try {
    const d = await api("GET", `/api/exam/exams/${examId}/attempts/result`);
    const r = d.result;
    const reason = r.submit_reason === "timeout" ? "超时自动结算"
                 : (r.submit_reason === "manual" ? "手动交卷" : "-");
    document.getElementById("resultBody").innerHTML =
      r.status === "submitted"
        ? `<div class="big">${r.total_score != null ? r.total_score + " 分" : "-"}</div>
           <p class="meta">提交时间：${r.submitted_at ? fmtTime(r.submitted_at) : "-"} · ${reason}</p>`
        : `<p class="meta">作答进行中，交卷后显示成绩。</p>`;
    show("view-result");
  } catch (e) {
    alert(e.message || "查询成绩失败");
    show("view-list");
  }
}

loadList();
</script>
</body>
</html>
