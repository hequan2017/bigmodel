<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 教学问答 · 学生端</title>
<style>
  body { font-family: system-ui, "PingFang SC", sans-serif; background: #f4f6f9; margin: 0; }
  header { background: #1f2937; color: #fff; padding: 12px 24px; display: flex;
           justify-content: space-between; align-items: center; }
  header .name { font-size: 15px; }
  header a { color: #93c5fd; text-decoration: none; margin-right: 12px; }
  header button { background: #374151; color: #fff; border: 0; border-radius: 6px;
                  padding: 6px 12px; cursor: pointer; }
  main { max-width: 760px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
          padding: 16px 20px; margin-bottom: 16px; }
  select, input { padding: 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  #chat { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 10px; font-size: 14px;
         white-space: pre-wrap; word-break: break-all; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #f1f5f9; color: #111827; }
  .refs { font-size: 12px; color: #6b7280; align-self: flex-start; background: #f8fafc;
          border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 10px; max-width: 82%; }
  .refs button { margin: 2px; padding: 2px 6px; font-size: 12px; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; }
  button.act { background: #2563eb; color: #fff; border: 0; border-radius: 6px;
               padding: 9px 18px; cursor: pointer; font-size: 14px; }
  button.act.gray { background: #6b7280; }
  button.act:disabled { background: #9ca3af; cursor: not-allowed; }
  .meta { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="name">AI 教学问答 · 学生端（<span id="whoami"></span>）</div>
  <div><a href="/exam.html">考试</a>
  <button onclick="logout()">退出登录</button></div>
</header>
<main>
  <div class="card">
    <div class="row">
      <label class="meta">选择问答应用</label>
      <select id="appSel" style="flex:1" onchange="onAppChange()"></select>
      <label class="meta">会话</label>
      <select id="convSel" style="flex:1" onchange="onConvChange()"><option value="">新会话</option></select>
      <button class="act gray" onclick="newConversation()">新会话</button>
    </div>
    <div id="chat"></div>
    <div class="row" style="margin-top:12px">
      <input id="q" placeholder="输入你的问题，例如：什么是检索增强生成？" onkeydown="if(event.key==='Enter')ask()">
      <button class="act" id="askBtn" onclick="ask()">发送</button>
      <button class="act gray hidden" id="stopBtn" onclick="stopGeneration()">停止</button>
    </div>
    <div class="meta" id="chatMsg" style="margin-top:8px">回答依据服务端授权检索的知识库生成，引用见上方标注。</div>
  </div>
</main>
<script>
const TOKEN = sessionStorage.getItem("token");
const ROLE = sessionStorage.getItem("role");
document.getElementById("whoami").textContent = sessionStorage.getItem("name") || "";
if (!TOKEN || ROLE !== "student") location.href = "/";

function logout() {
  try { fetch("/api/auth/logout", { method: "POST", headers: headers() }).catch(() => {}); } catch (e) {}
  sessionStorage.clear();
  location.href = "/";
}
function headers() { return { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }; }
async function api(method, path) {
  const r = await fetch(path, { method, headers: headers() });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw { message: "登录已失效" }; }
  if (!r.ok) throw { message: d.error ? d.error.message : "请求失败" };
  return d;
}

let conversationId = "";
let apps = [];
let currentAbort = null;

function convKey() { return "conv_" + document.getElementById("appSel").value; }

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addRefs(appId, refs) {
  const div = document.createElement("div");
  div.className = "refs";
  if (!refs.length) {
    div.textContent = "（本次未检索到参考资料）";
  } else {
    div.textContent = "引用来源（点击查看原文）: ";
    for (const ref of refs) {
      const b = document.createElement("button");
      b.className = "act gray";
      b.style.margin = "2px";
      b.style.padding = "2px 6px";
      b.textContent = `《${ref.title}》`;
      b.onclick = async () => {
        try {
          const d = await api("GET",
            `/api/apps/${appId}/kb-documents/${ref.document_id}/chunks`);
          const hit = d.chunks.find((c) =>
            c.start_offset === ref.start_offset && c.end_offset === ref.end_offset)
            || d.chunks[ref.chunk_index];
          const box = document.createElement("div");
          box.className = "msg assistant";
          box.textContent = `【原文】《${ref.title}》 片段${hit ? hit.index : "?"}\n`
            + (hit ? hit.content : "片段不存在（文档可能已更新）");
          const chat2 = document.getElementById("chat");
          chat2.appendChild(box);
          chat2.scrollTop = chat2.scrollHeight;
        } catch (e) {
          const box = document.createElement("div");
          box.className = "refs";
          box.textContent = "原文加载失败: " + (e.message || "未知错误");
          const chat2 = document.getElementById("chat");
          chat2.appendChild(box);
        }
      };
      div.appendChild(b);
    }
  }
  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function loadApps() {
  const d = await api("GET", "/api/apps");
  apps = d.apps.filter((a) => a.status === "published");
  const sel = document.getElementById("appSel");
  sel.innerHTML = "";
  if (apps.length === 0) {
    sel.innerHTML = '<option>暂无已发布的问答应用</option>';
    document.getElementById("askBtn").disabled = true;
    return;
  }
  for (const a of apps) {
    const opt = document.createElement("option");
    opt.value = a.id; opt.textContent = `#${a.id} ${a.name}`;
    sel.appendChild(opt);
  }
}

/* ---------- 会话管理 ---------- */
async function onAppChange() {
  // 应用切换：恢复该应用最近会话并刷新会话列表
  conversationId = sessionStorage.getItem(convKey()) || "";
  document.getElementById("chat").innerHTML = "";
  await refreshConversations();
  await restoreConversation();
}

async function refreshConversations() {
  const sel = document.getElementById("convSel");
  const appId = document.getElementById("appSel").value;
  sel.innerHTML = '<option value="">新会话</option>';
  try {
    const d = await api("GET", `/api/apps/${appId}/conversations`);
    for (const c of d.conversations) {
      const opt = document.createElement("option");
      opt.value = c.conversation_id;
      opt.textContent = `${c.conversation_id.slice(0, 8)}…（${c.message_count} 条 · ${new Date(c.last_at).toLocaleString("zh-CN", { hour12: false })}）`;
      sel.appendChild(opt);
    }
    if (conversationId) sel.value = conversationId;
  } catch (e) { /* 列表加载失败不阻断 */ }
}

async function restoreConversation() {
  document.getElementById("chat").innerHTML = "";
  if (!conversationId) {
    document.getElementById("chatMsg").textContent =
      `当前应用：${document.getElementById("appSel").selectedOptions[0].textContent} · 新会话`;
    return;
  }
  try {
    const d = await api("GET", `/api/apps/${document.getElementById("appSel").value}/messages?conversation_id=${encodeURIComponent(conversationId)}`);
    for (const m of d.messages) addMsg(m.role === "user" ? "user" : "assistant", m.content);
    document.getElementById("chatMsg").textContent =
      `已恢复历史会话（${d.messages.length} 条记录）`;
  } catch (e) { /* 历史加载失败不阻断使用 */ }
}

function onConvChange() {
  conversationId = document.getElementById("convSel").value || "";
  sessionStorage.setItem(convKey(), conversationId);
  restoreConversation();
}

async function newConversation() {
  conversationId = "";
  sessionStorage.removeItem(convKey());
  document.getElementById("convSel").value = "";
  document.getElementById("chat").innerHTML = "";
  document.getElementById("chatMsg").textContent = "已开启新会话";
  await refreshConversations();
}

/* ---------- 问答运行 ---------- */
async function ask() {
  const btn = document.getElementById("askBtn");
  const input = document.getElementById("q");
  const question = input.value.trim();
  if (!question || btn.disabled) return;
  if (apps.length === 0) return;
  input.value = "";
  btn.disabled = true;
  const stopBtn = document.getElementById("stopBtn");
  currentAbort = new AbortController();
  stopBtn.classList.remove("hidden");
  addMsg("user", question);
  const out = addMsg("assistant", "（生成中...）");
  try {
    const r = await fetch(`/api/apps/${document.getElementById("appSel").value}/run`, {
      method: "POST", headers: headers(),
      signal: currentAbort.signal,
      body: JSON.stringify({ question, conversation_id: conversationId }) });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      out.textContent = "运行失败: " + (d.error ? d.error.message : r.status);
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", type = null, data = "", first = true;
    const handle = (t, payload) => {
      if (t === "start") {
        conversationId = payload.conversation_id || conversationId;
        sessionStorage.setItem(convKey(), conversationId);
        refreshConversations();
      }
      else if (t === "delta") {
        if (first) { out.textContent = ""; first = false; }
        out.textContent += payload.text;
        document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      }
      else if (t === "references") addRefs(document.getElementById("appSel").value, payload.references || []);
      else if (t === "error") out.textContent += "\n[错误] " + payload.code + ": " + payload.message;
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 1);
        if (line.startsWith("event: ")) type = line.slice(7).trim();
        else if (line.startsWith("data: ")) data += line.slice(6);
        else if (line === "" && type !== null) {
          try { handle(type, data ? JSON.parse(data) : {}); } catch (perr) { /* 忽略单事件解析错误 */ }
          type = null; data = "";
        }
      }
    }
    if (first) out.textContent = "（无输出内容）";
  } catch (e) {
    if (e.name === "AbortError") {
      out.textContent += "\n[已停止生成]";
    } else {
      out.textContent = "网络错误: " + (e.message || "请稍后重试");
    }
  } finally {
    btn.disabled = false;
    stopBtn.classList.add("hidden");
    currentAbort = null;
  }
}

function stopGeneration() {
  if (currentAbort) currentAbort.abort();
}

loadApps().then(onAppChange);
</script>
</body>
</html>
