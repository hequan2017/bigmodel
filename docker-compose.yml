services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bigmodel-db
    environment:
      POSTGRES_USER: bigmodel
      POSTGRES_PASSWORD: bigmodel
      POSTGRES_DB: bigmodel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigmodel -d bigmodel"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      # Docker Hub 不可达时切换镜像源：
      # args:
      #   GO_IMAGE: docker.m.daocloud.io/library/golang:1.27-alpine
    container_name: bigmodel-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_HTTP_ADDR: ":8080"
      APP_DATA_DIR: /data
      DATABASE_URL: postgres://bigmodel:bigmodel@db:5432/bigmodel?sslmode=disable
      APP_CHAT_BASE_URL: ${APP_CHAT_BASE_URL:-}
      APP_CHAT_API_KEY: ${APP_CHAT_API_KEY:-}
      APP_CHAT_MODEL: ${APP_CHAT_MODEL:-}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL:-}
      APP_EMBEDDING_API_KEY: ${APP_EMBEDDING_API_KEY:-}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-}
    ports:
      - "18090:8080"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/readyz | grep -q ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

volumes:
  db_data:
  app_data:
