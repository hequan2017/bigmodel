name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bigmodel
          POSTGRES_PASSWORD: bigmodel
          POSTGRES_DB: bigmodel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigmodel -d bigmodel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://bigmodel:bigmodel@localhost:5432/bigmodel?sslmode=disable
      APP_DATA_DIR: /tmp/bigmodel-ci-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test（含数据库集成测试）
        run: go test ./... -v

      - name: 数据库诊断（扩展与迁移状态）
        if: always()
        run: |
          DBID=${{ job.services.db.id }}
          docker exec $DBID psql -U bigmodel -d bigmodel -c \
            "SELECT extname FROM pg_extension;" || true
          docker exec $DBID psql -U bigmodel -d bigmodel -c \
            "SELECT version FROM schema_migrations ORDER BY version;" || true
          docker exec $DBID psql -U bigmodel -d bigmodel -c \
            "SELECT tableschema FROM (SELECT 'x' AS tableschema) t;" || true

      - name: E2E 冒烟回归（mock 上游 + 全链路）
        run: |
          set +e
          go build -o bin/server ./cmd/server
          go run ./cmd/mockupstream > /tmp/mock.log 2>&1 &
          APP_HTTP_ADDR=:18080 APP_DATA_DIR=/tmp/bigmodel-e2e \
            APP_CHAT_BASE_URL=http://127.0.0.1:18081 APP_CHAT_API_KEY=dev APP_CHAT_MODEL=mock-chat \
            APP_EMBEDDING_BASE_URL=http://127.0.0.1:18081 APP_EMBEDDING_API_KEY=dev APP_EMBEDDING_MODEL=mock-embedding \
            ./bin/server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/readyz > /dev/null
          APP_DATA_DIR=/tmp/bigmodel-e2e \
            APP_SEED_TEACHER_PASSWORD=teacher@123 APP_SEED_STUDENT_PASSWORD=student@123 \
            go run ./cmd/seed > /tmp/seed.log 2>&1
          bash scripts/e2e-smoke.sh http://127.0.0.1:18080 > /tmp/e2e-out.txt 2>&1
          RC=$?
          cat /tmp/e2e-out.txt
          DBID=${{ job.services.db.id }}
          {
            echo "=== e2e 输出 ==="; cat /tmp/e2e-out.txt
            echo "=== seed.log ==="; cat /tmp/seed.log
            echo "=== server.log ==="; tail -40 /tmp/server.log
            echo "=== mock.log ==="; cat /tmp/mock.log
            echo "=== 扩展 ==="
            docker exec $DBID psql -U bigmodel -d bigmodel -c "SELECT extname FROM pg_extension;" 2>&1
            echo "=== 迁移表 ==="
            docker exec $DBID psql -U bigmodel -d bigmodel -c "SELECT version FROM schema_migrations ORDER BY version;" 2>&1
            echo "=== document_chunks 是否存在 ==="
            docker exec $DBID psql -U bigmodel -d bigmodel -c "SELECT to_regclass('public.document_chunks');" 2>&1
          } > /tmp/ci-diag.txt
          git config user.email ci-debug@local
          git config user.name ci-debug
          git checkout -B ci-debug
          mkdir -p ci-diag && cp /tmp/ci-diag.txt ci-diag/diag.txt
          git add -A ci-diag && git commit -m "ci-debug: E2E 诊断" || true
          git push -f origin ci-debug || echo "诊断推送失败"
          exit $RC
