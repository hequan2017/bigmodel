# nginx 反向代理配置（compose 容器网络版）：
# upstream 直接指向 compose 服务名 app:8080，由 Docker DNS 解析副本。
# 与 nginx-example.conf（宿主机部署版）配套，见 README 部署小节。

upstream bigmodel_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;

    # 统一安全响应头（应用已带，代理层兜底）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://bigmodel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（/api/apps/{id}/run）透传要点：
        proxy_buffering off;          # 不缓冲，保证流式增量即时到达
        proxy_read_timeout 300s;      # 对齐应用侧 runTimeout（180s）留余量
        proxy_set_header Connection "";
    }
}
