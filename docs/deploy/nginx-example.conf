# nginx 反向代理示例（多副本部署，§16.2）
# 说明：本示例为部署文档模板，需按实际环境调整端口、证书与副本地址后使用。
#
# 前置：多副本共享存储改造完成前，多副本仅适合无状态 API（文档原始文件
# 依赖本地卷，见 README 部署小节的如实说明）。

upstream bigmodel_app {
    # 多副本：docker compose up -d --scale app=2 后由 compose DNS 轮询，
    # 或在此显式列出副本地址。
    server 127.0.0.1:18090;
    # server 127.0.0.1:18091;
    keepalive 32;
}

server {
    listen 80;
    server_name exam.example.com;

    # 统一安全响应头（应用已带，代理层兜底）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://bigmodel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（/api/apps/{id}/run）透传要点：
        proxy_buffering off;          # 不缓冲，保证流式增量即时到达
        proxy_read_timeout 300s;      # 对齐应用侧 runTimeout（180s）留余量
        proxy_set_header Connection "";
    }
}
